<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Top Scores</title>

<link rel="stylesheet" href="../css/score.css">

</head>

<body>

<div id="space"></div>

<main class="arcade-screen">

<h1>TOP SCORES</h1>

<section id="game-container">

    <h2 class="codequestarcade">
        CODE QUEST ARCADE
    </h2>

    <p class="powerup-javascript">
        <span class="powerup">TOP PLAYERS</span>
        OF THE ARCADE
    </p>

    <div id="scores">

        <p class="score">
            <span class="rank">1.</span>
            <span class="player">PLAYER</span>
            <span class="points">000</span>
        </p>

        <p class="score">
            <span class="rank">2.</span>
            <span class="player">PLAYER</span>
            <span class="points">000</span>
        </p>

        <p class="score">
            <span class="rank">3.</span>
            <span class="player">PLAYER</span>
            <span class="points">000</span>
        </p>

        <p class="score">
            <span class="rank">4.</span>
            <span class="player">PLAYER</span>
            <span class="points">000</span>
        </p>

        <p class="score">
            <span class="rank">5.</span>
            <span class="player">PLAYER</span>
            <span class="points">000</span>
        </p>

    </div>

</section>

</main>

<script src="../js/score.js"></script>

</body>

</html>
