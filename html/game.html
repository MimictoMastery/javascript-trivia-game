<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Trivia</title>
<link rel="stylesheet" href="../css/game.css">

</head>
<body>

<div id="space"></div>

<div class="trivia-box">
    <h1>JavaScript Trivia</h1>

    <h2 id="question"> Loading Question...</h2>

    <div class="answers">
        <button onclick="checkAnswer('A')">A.</button>
        <button onclick="checkAnswer('B')">B.</button>
        <button onclick="checkAnswer('C')">C.</button>
        <button onclick="checkAnswer('D')">D.</button>
    </div>

    <p id="result"></p>
    <button id="highScorePage" onclick="goToHighScores()" style="display:none;">
        View High Scores
    </button>
</div>

<script src="../js/game.js"></script>


</body>

</html>
